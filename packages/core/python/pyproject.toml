[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codecli-thinking"
version = "0.1.0"
description = "CodeCLI Thinking Engine — LLM provider abstraction and prompt formatting"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
